name: AI 情报台 · 抓取 + 部署

# 自维护流水线：
#   1. 抓取 B站 / AcFun 最新 AI 内容 → public/data/feed.json（慢通道，仓库内含快照）
#   2. 构建前端（把最新快照烘焙进 dist/data/feed.json，Worker 边缘抓取失败时的兜底）
#   3. 部署到 Cloudflare（Worker + 静态资源）
#   4. 提交快照回仓库，保住「仓库即数据源」的属性
on:
  schedule:
    - cron: '0 * * * *' # 每小时整点
  workflow_dispatch:
    inputs:
      mode:
        description: 抓取模式
        required: false
        default: full
        type: choice
        options: [full, quick]

permissions:
  contents: write

concurrency:
  group: crawl-deploy
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 抓取最新情报
        run: |
          if [ "${{ github.event.inputs.mode }}" = "quick" ]; then
            node scripts/crawl.mjs --quick
          else
            node scripts/crawl.mjs
          fi

      - name: 验证产出不为空
        run: |
          node -e "
            const d = require('./public/data/feed.json');
            if (!d.items || d.items.length < 10) {
              console.error('产出条目过少:', d.items?.length ?? 0);
              process.exit(1);
            }
            console.log('OK:', d.items.length, '条,', d.meta.summary.freshLast24h, '条24h内');
          "

      - name: 构建前端
        run: pnpm build

      - name: 部署到 Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: 提交快照
        run: |
          git config user.name 'ai-radar-bot'
          git config user.email 'bot@users.noreply.github.com'
          git add public/data/feed.json
          if git diff --cached --quiet; then
            echo '快照无变化，跳过提交'
            exit 0
          fi
          STATS=$(node -e "const d=require('./public/data/feed.json');process.stdout.write(d.items.length+'条/'+d.meta.summary.freshLast24h+'条24h内')")
          git commit -m "chore(crawl): $(date -u +%Y-%m-%dT%H:%MZ) — ${STATS}"
          git pull --rebase origin main
          git push
